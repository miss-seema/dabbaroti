# Nginx Configuration for Dabba Roti on Hostinger VPS
# Place in: /etc/nginx/sites-available/dabbaroti
# Enable with: sudo ln -s /etc/nginx/sites-available/dabbaroti /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name www.dabbaroti.com dabbaroti.com;

    # Redirect all HTTP traffic to HTTPS (Certbot will manage SSL certificates)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.dabbaroti.com dabbaroti.com;

    # SSL Certificates (Automatically configured by Certbot)
    # ssl_certificate /etc/letsencrypt/live/dabbaroti.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dabbaroti.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Root directory for static production build
    root /var/www/dabbaroti/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Reverse Proxy for Express Backend API routes
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Single Page Application (SPA) Fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
